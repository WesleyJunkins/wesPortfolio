name: Generate Archive Manifest

on:
  push:
    paths:
      - 'archive/**'
      - 'generate-archive-manifest.js'
  workflow_dispatch: # Allows manual triggering

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Generate archive manifest
        run: node generate-archive-manifest.js
        
      - name: Commit manifest if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add archive/manifest.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate archive manifest [skip ci]"
            git push
          fi

