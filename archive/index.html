<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Private family archive: keep it out of search results -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Junkins Archive</title>
    <meta name="description" content="Private family archive." />
    <meta name="author" content="Wesley Junkins" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Shared favicons live at the site root -->
    <link rel="icon" type="image/x-icon" href="/weslogo/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/weslogo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/weslogo/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/weslogo/apple-touch-icon.png" />

    <!-- VT323 = CRT/OSD face; Caveat = handwritten tape labels -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Caveat:wght@600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Camcorder OSD bar -->
    <header class="osd" id="osd">
        <div class="osd__group">
            <span class="osd__play">&#9654;&nbsp;PLAY</span>
            <span class="osd__rec"><i class="osd__dot"></i>REC</span>
        </div>
        <div class="osd__title">THE&nbsp;JUNKINS&nbsp;ARCHIVE</div>
        <div class="osd__group osd__group--right">
            <span class="osd__clock" id="osd-clock">SP&nbsp;&nbsp;0:00:00</span>
            <a class="osd__exit" href="/" title="Back to wesleyjunkins.com">&#9099;&nbsp;EXIT</a>
        </div>
    </header>

    <!-- Lock screen (password) -->
    <div id="lock-screen" class="lock">
        <div class="lock__panel">
            <div class="lock__head">&#9654; ENTER ACCESS CODE</div>
            <p class="lock__sub">This tape is protected. Enter the family code to play.</p>
            <form id="lock-form" class="lock__form" autocomplete="off">
                <input id="code-input" class="lock__input" type="password" inputmode="text"
                    placeholder="________" autocomplete="off" required autofocus />
                <div id="lock-error" class="lock__error" role="alert"></div>
                <button type="submit" class="lock__btn">PLAY&nbsp;&#9654;</button>
            </form>
        </div>
    </div>

    <!-- Archive content (revealed after unlock) -->
    <main id="archive-content" hidden>
        <div class="archive__head">
            <h1 class="archive__h1">The Junkins Family Archive</h1>
            <p class="archive__intro">Home movies on tape &amp; beyond &mdash; press play on a memory.</p>
        </div>
        <div id="tapes" class="tapes"></div>
    </main>

    <!-- In-page CRT player -->
    <div id="player" class="player" hidden>
        <div class="player__backdrop" data-close></div>
        <div class="player__tv" role="dialog" aria-modal="true" aria-label="Video player">
            <div class="player__screen">
                <div id="player-media" class="player__media"></div>
                <div class="player__scan" aria-hidden="true"></div>
                <div class="player__glare" aria-hidden="true"></div>
            </div>
            <div class="player__osd">
                <span class="player__status">&#9654;&nbsp;PLAY</span>
                <span id="player-title" class="player__name"></span>
                <span id="player-time" class="player__time">0:00:00</span>
                <a id="player-yt" class="player__yt" target="_blank" rel="noopener">&#8599;&nbsp;YT</a>
                <button class="player__close" data-close type="button" aria-label="Stop and close">&#9209;&nbsp;STOP</button>
            </div>
        </div>
    </div>

    <!-- CRT overlay (decorative, never blocks clicks) -->
    <div class="crt" aria-hidden="true">
        <div class="crt__scan"></div>
        <div class="crt__vignette"></div>
        <div class="crt__flicker"></div>
        <div class="crt__track"></div>
    </div>

    <script src="crypto.js"></script>
    <script src="app.js"></script>
</body>

</html>
